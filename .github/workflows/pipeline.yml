
name: Universal ML Deployment Pipeline

on:
  push:
    paths:
      - 'input/**'
      - '**.onnx'
      - '**.pt'
      - '**.pth'
      - '**.h5'
      - '**.keras'
      - '**.pb'
      - '**.py'

jobs:
  optimize:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        hardware:
          - raspberry_pi
          - jetson
          - android

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p output reports artifacts converted

      - name: Run pipeline
        run: |
          python main.py             --model input/model.pt             --hardware ${{ matrix.hardware }}

      - name: Package deployment bundle
        run: |
          python deploy/package.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimized-${{ matrix.hardware }}
          path: |
            output/
            reports/
            deployment_bundle.zip
